known_providers:
  huggingface:
    chat:
      input:
        description: 'Input provided to the model.'
        type: 'string'
        default: 'Introduce yourself.'
        required: true
      authentication:
        description: 'Token authentication for the server.'
        type: 'string'
        required: false
      configuration:
        model:
          top_k:
            description: 'The number of highest probability vocabulary tokens.'
            type: 'int'
            required: false
          top_p:
            description: 'An alternative to sampling with temperature, called nucleus sampling.'
            type: 'float'
            required: false
          temperature:
            description: 'Sampling temperature 0-1. Higher values mean more random output.'
            type: 'float'
            default: 1.0
            required: false
          repetition_penalty:
            description: 'Number between -2.0 and 2.0. Positive values penalize new tokens.'
            type: 'float'
            default: 1.0
            required: false
          max_new_tokens:
            description: 'Max number of new tokens generated by model.'
            type: 'int'
            default: 250
            required: false
          do_sample:
            description: 'Whether or not to use sampling; use greedy decoding otherwise.'
            type: 'bool'
            default: false
            required: false
          return_full_text:
            description: 'Whether return full text including input.'
            type: 'bool'
            default: false
            required: false
          stream:
            description: 'Allow stream return token by token.'
            type: 'bool'
            default: false
            required: false
        api:
          namespace:
            description: 'Model namespace at HuggingFace.'
            type: 'string'
            default: 'mistralai/Mistral-7B-Instruct-v0.2'
            required: true
          name:
            description: 'Model name in menu.'
            type: 'string'
            default: 'Mistral 7B v2'
            required: true
          use_cache:
            description: 'Use cache when the input is the same.'
            type: 'bool'
            default: false
            required: false
          wait_for_model:
            description: 'Wait for model to load instead of receiving 503 code.'
            type: 'bool'
            default: true
            required: false
    summarization:
      input:
        description: 'Text input for embedding.'
        type: 'string'
        default: 'Lorem ipsum.'
        required: true
      authentication:
        description: 'Authentication for the server.'
        type: 'string'
        required: false
      configuration:
        model:
          top_k:
            description: 'The number of highest probability vocabulary tokens.'
            type: 'int'
            required: false
          top_p:
            description: 'An alternative to sampling with temperature, called nucleus sampling.'
            type: 'float'
            required: false
          temperature:
            description: 'Sampling temperature 0-1. Higher values mean more random output.'
            type: 'float'
            default: 1.0
            required: false
          repetition_penalty:
            description: 'Number between -2.0 and 2.0. Positive values penalize new tokens.'
            type: 'float'
            default: 1.0
            required: false
          max_length:
            description: 'Max length of the output.'
            type: 'int'
            default: 255
            required: false
          min_length:
            description: 'Min length of the output.'
            type: 'int'
            default: 127
            required: false
          do_sample:
            description: 'Whether or not to use sampling; use greedy decoding otherwise.'
            type: 'bool'
            default: false
            required: false
        api:
          namespace:
            description: 'Model namespace at HuggingFace.'
            type: 'string'
            default: 'facebook/bart-large-cnn'
            required: true
          name:
            description: 'Model name in menu.'
            type: 'string'
            default: 'Bart Large CNN'
            required: true
          use_cache:
            description: 'Use cache when the input is the same.'
            type: 'bool'
            default: false
            required: false
          wait_for_model:
            description: 'Wait for model to load instead of receiving 503 code.'
            type: 'bool'
            default: true
            required: false
