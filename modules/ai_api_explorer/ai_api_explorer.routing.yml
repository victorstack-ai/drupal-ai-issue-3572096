ai_api_explorer.text_completion_form:
  path: '/admin/config/ai/development/ai-text-completion'
  defaults:
    _title: 'AI Prompt Explorer'
    _form: 'Drupal\ai_api_explorer\Form\TextCompletionForm'
  requirements:
    _permission: 'access ai prompt'
ai_api_explorer.image_generation_form:
  path: '/admin/config/development/ai-image-generation'
  defaults:
    _title: 'AI Image Generation Explorer'
    _form: 'Drupal\ai_api_explorer\Form\TextToImageGenerationForm'
  requirements:
    _permission: 'access ai prompt'
ai_api_explorer.text_to_speech_form:
  path: '/admin/config/development/ai-text-to-speech'
  defaults:
    _title: 'AI Text To Speech Generation Explorer'
    _form: 'Drupal\ai_api_explorer\Form\TextToSpeechGenerationForm'
  requirements:
    _permission: 'access ai prompt'
ai_api_explorer.speech_to_text_form:
  path: '/admin/config/development/ai-speech-to-text'
  defaults:
    _title: 'AI Speech To Text Generation Explorer'
    _form: 'Drupal\ai_api_explorer\Form\SpeechToTextGenerationForm'
  requirements:
    _permission: 'access ai prompt'
