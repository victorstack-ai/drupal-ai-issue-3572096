services:
  ai.huggingface_provider:
    class: Drupal\ai\Provider\HuggingFaceProvider
    factory: [ 'Drupal\ai\Factory\HuggingFaceProviderFactory', 'create' ]
    arguments: [ '@service_container' ]

  ai.manager:
    class: Drupal\ai\Service\AiManager
    arguments: ['@module_handler', '@ai.huggingface_provider']
